<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Login</title>
</head>
<body>
    <h1><Header>Hello World!</Header></h1>
    <h4>Welcome to my website!</h4>
    <img src="Images/Beach.jpg" alt="Couldn't load image">
</body>
<form action="">
    <section>
        <label for="name">Name</label>
        <input type="text" name="Name" id="Name" placeholder="Enter your name" required>
    </section>
    <section>
        <label for="email">Email</label>
        <input type="email" name="Email" id="Email" placeholder="Enter your email" required>
    </section>
    <section>
        <label for="Password">Password</label>
        <input type="password" name="Password" id="password" placeholder="Enter your password" required>
    </section>
    <section>
        <label for="Checkbox">I agree to the TOS</label>
        <input type="checkbox" name="Checkbox" id="Checkbox" required style="column-gap: 10px;">
    </section>
    <section>
        <label for="Date">Date of birth</label>
        <input type="date" name="Date" id="Date" required>
        <label for="Datetime">Time</label>
        <input type="datetime" name="Datetime" id="Datetime" required>
    </section>
    <section>
        <label for="URL">Link</label>
        <input type="url" name="Url" id="Url" placeholder="URL" required>
    </section>
    <section>
        <label for="Radio">Please Choose Method</label>
        <input type="radio" name="Radio" id="Radio" required>
    </section>
    <section>
        <label for="File">Upload File</label>
        <input type="file" name="file" id="file" required>
    </section>
    <section>
        <textarea name="Message" id="Message" cols="50" rows="15"></textarea>
    </section>
    <section>
        <Input:submit>Finished:</Input:submit>
        <button type="submit">Submit</button>
    </section>
</form>
</html>
